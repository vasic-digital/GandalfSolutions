# pkg/client i18n bundle — active English (en) locale.
#
# Every entry maps a CONST-046-migrated hardcoded literal in
# GandalfSolutions/pkg/client/client.go (the built-in seed corpus)
# to a message ID resolved at runtime via Translator.T. A consuming
# binary wires a real Translator at boot; the in-package
# NoopTranslator echoes the message ID verbatim for unit tests +
# backward compat.
#
# Naming convention: gandalf_client_<area>_<short_description>.
# All IDs prefixed with gandalf_client_ to avoid namespace collision
# with other packages' bundles when loaded into the same go-i18n
# Bundle.
#
# Round-335 §11.4 anti-bluff sweep (2026-05-19): migrated the 20
# most user-facing literals of the seedDefaults built-in corpus —
# 8 level descriptions + 8 level solution fragments (first solution
# of each level) + 2 adventure descriptions + 2 adventure solution
# fragments. The corpus is reference research material presented to
# the end user; non-English consumers must be able to localise it.

# --- level descriptions ---

